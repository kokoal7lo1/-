<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأخطبوط</title>
<meta name="theme-color" content="#2F5D50">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--surface:#fff;--ink:#1B2233;--muted:#6B7385;--line:#E3E7F0;--accent:#0E9F8E;--accent2:#2F7DE1;--on:#fff;--danger:#E0485A}
.dark{--bg:#0E1220;--surface:#171C2E;--ink:#EEF1F8;--muted:#98A1B8;--line:#252C44;--danger:#FF7A8A}
body[data-t=teams]{--accent:#12A150;--accent2:#0EA5A5}
body[data-t=mafia]{--accent:#7C3AED;--accent2:#DB2777}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--accent) 16%,transparent),transparent 50%),var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6;text-align:start}
.container{max-width:480px;margin:auto;padding:24px 18px 60px}
h2,h3{font-weight:600;margin:20px 0 10px}
h3{font-size:18px}
.muted{color:var(--muted);font-size:14px}
button{font:inherit;font-weight:600;width:100%;padding:14px;margin:6px 0;border:1px solid transparent;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);cursor:pointer;box-shadow:0 8px 18px -10px var(--accent);transition:transform .1s,opacity .15s}
button:active{transform:scale(.97);opacity:.9}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gray,.delete,.small-btn,.back,button.row{box-shadow:none}
.gray{background:transparent;color:var(--ink);border-color:var(--line)}
.delete{background:transparent;color:var(--danger);border-color:var(--line)}
.back{width:auto;display:block;background:none;color:var(--muted);padding:6px 0;margin:0 0 10px;text-align:start}
.hero{position:relative;overflow:hidden;color:#fff;padding:30px 22px;border-radius:26px;margin-bottom:22px;background:linear-gradient(135deg,#0E9F8E,#2F7DE1 60%,#7C3AED);box-shadow:0 18px 30px -18px #2F7DE1}
.hero::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12);top:-70px;left:-50px}
.hero h1{position:relative;margin:8px 0 2px;font-size:30px;font-weight:600}
.hero p{position:relative;margin:0;opacity:.92}
.ball{position:relative;font-size:46px;animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
button.row{display:flex;align-items:center;gap:14px;text-align:start;background:var(--surface);color:var(--ink);border-color:var(--line);padding:14px;margin:10px 0}
.row .ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:26px;flex:none;background:linear-gradient(135deg,var(--a),var(--b))}
.row b{display:block;font-size:17px}
.row small{color:var(--muted);font-size:14px;font-weight:400}
.row .ar{margin-inline-start:auto;color:var(--muted);font-size:22px}
.banner{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;color:#fff;margin:4px 0 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 24px -14px var(--accent)}
.banner h2{margin:0;font-size:21px}
.banner p{margin:2px 0 0;opacity:.9;font-size:14px}
.bi{font-size:28px;width:52px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.2);border-radius:16px;flex:none}
input,select{width:100%;padding:13px 14px;margin:6px 0;font:inherit;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus,select:focus{border-color:var(--accent)}
.player{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.player div{display:flex;gap:6px;align-items:center}
.who{display:flex;align-items:center;gap:12px}
.who small{color:var(--muted)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.small-btn{width:auto;margin:0;padding:6px 12px;background:var(--surface);color:var(--ink);border-color:var(--line)}
.small-btn.delete{color:var(--danger)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0;line-height:1.9}
.box h3{margin:0 0 6px}
.box .small-btn{margin:8px 0 0 6px}
.team{color:#fff;border-radius:20px;padding:16px;margin:12px 0}
.t1{background:linear-gradient(135deg,#2563EB,#06B6D4)}
.t2{background:linear-gradient(135deg,#F97316,#F43F5E)}
.team h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.team em{font-style:normal;background:rgba(255,255,255,.22);padding:2px 14px;border-radius:99px}
.pl{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.2)}
.pl:last-child{border:0}
.pl .av{width:32px;height:32px;font-size:14px;border:2px solid rgba(255,255,255,.7)}
.pl span:last-child{margin-inline-start:auto;font-size:12px}
.role-box{padding:16px;margin:8px 0;border-radius:16px;color:#fff;font-weight:600}
.tag{padding:4px 12px;border-radius:8px;color:#fff;font-weight:600}
.mafia{background:linear-gradient(135deg,#E11D48,#7F1D1D)}.sheeb{background:linear-gradient(135deg,#3B82F6,#1E3A8A)}
.doctor{background:linear-gradient(135deg,#10B981,#047857)}.detective{background:linear-gradient(135deg,#A855F7,#6D28D9)}
.sniper{background:linear-gradient(135deg,#F59E0B,#B45309)}.guard{background:linear-gradient(135deg,#14B8A6,#0F766E)}
.adami{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.big{font-size:64px;line-height:1.1}
.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;text-align:center}
#clock{font-size:46px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s linear}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
.pick{display:flex;align-items:center}
.st{width:auto;margin:0;padding:0 3px;border:0;background:none;box-shadow:none;color:#F5A524;font-size:28px;line-height:1.2}
.sheet{background:var(--surface);color:var(--ink);border-radius:22px;padding:16px;width:100%;max-width:440px;animation:pop .35s cubic-bezier(.2,1.3,.4,1) both}
.tabs{display:flex;gap:8px}
.tabs button{margin:0;padding:11px 8px;font-size:15px}
.sbody{max-height:58vh;overflow:auto;margin:12px 0;text-align:start}
.hcard{background:var(--bg);border-radius:14px;padding:12px 14px;margin:8px 0}
.hcard p{margin:4px 0 0;color:var(--muted);line-height:1.8}
.role-box summary{cursor:pointer;list-style:none;font-size:17px}
.role-box summary::-webkit-details-marker{display:none}
.role-box p{margin:10px 0 0;font-weight:400;line-height:1.8}
.corner{position:fixed;bottom:14px;left:14px;width:38px;height:38px;padding:0;margin:0;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:none;font-size:18px;opacity:.55}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:10}
.dlg{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;width:100%;max-width:340px;text-align:center}
.dlg p{margin:0 0 12px;font-size:18px;font-weight:600}
#app>*{animation:up .35s both}
#app>.t2{animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="container"></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars = n => "⭐".repeat(n);
const sum = a => a.reduce((s, p) => s + p.rating, 0);
const ICON = {"مافيا":"😈","دكتور":"🩺","شايب":"👴","قناص":"🎯","حارس":"🛡️","آدمي":"🙂"};
const col = s => { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 360; return `hsl(${h} 60% 48%)`; };
const av = n => `<span class="av" style="background:${col(n)}">${esc([...n][0] || "?")}</span>`;
const bn = (i, t, sub = "") => `<div class="banner"><span class="bi">${i}</span><div><h2>${t}</h2>${sub ? `<p>${sub}</p>` : ""}</div></div>`;
const theme = n => { document.body.dataset.t = n; };

function load(k){
  try{ const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
let players = load("players"), savedTeams = load("teams"), mafiaPlayers = load("mafiaPlayers");
let darkMode = localStorage.getItem("dark") === "true";
if (darkMode) document.body.classList.add("dark");

function saveAll(){
  try{
    localStorage.setItem("players", JSON.stringify(players));
    localStorage.setItem("teams", JSON.stringify(savedTeams));
    localStorage.setItem("mafiaPlayers", JSON.stringify(mafiaPlayers));
  }catch(e){ toast("ما قدرت أحفظ البيانات"); }
}

let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// خلط عشوائي عادل (Fisher-Yates)
function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function copyText(txt){
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(() => toast("تم النسخ ✅"))
    .catch(() => prompt("انسخ النص:", txt));
}

function credit(){
  const d = document.createElement("div");
  d.className = "modal";
  d.onclick = e => { if (e.target === d) d.remove(); };
  d.innerHTML = `<div class="dlg"><div style="font-size:54px">🐙</div><p>أنا الموقع من إنشاء تقي</p>
    <button class="gray" onclick="this.closest('.modal').remove()">تمام</button></div>`;
  document.body.appendChild(d);
}

function onEnter(e, fn){ if (e.key === "Enter") fn(); }

// نافذة تأكيد داخل الصفحة (بدل confirm الجاهزة اللي بعض المتصفحات تمنعها)
function ask(msg, yes){
  const d = document.createElement("div");
  d.className = "modal";
  d.innerHTML = `<div class="dlg"><p>${esc(msg)}</p>
    <button id="yes" style="background:var(--danger)">نعم</button>
    <button id="no" class="gray">لا</button></div>`;
  document.body.appendChild(d);
  $("yes").onclick = () => { d.remove(); yes(); };
  $("no").onclick = () => d.remove();
}

/* ===== MENU ===== */
function showMenu(){
  theme("home");
  $("app").innerHTML = `
    <div class="hero"><div class="ball">🐙</div><h1>الأخطبوط</h1><p>كل شي تبيه موجود</p></div>
    <button class="row" onclick="teamsMenu()"><span class="ico" style="--a:#16A34A;--b:#0EA5A5">⚽</span><span><b>تقسيمات</b><small>فريقين متوازنين من لاعبينك</small></span><span class="ar">‹</span></button>
    <button class="row" onclick="mafiaMenu()"><span class="ico" style="--a:#7C3AED;--b:#DB2777">🕵️</span><span><b>مافيا</b><small>توزيع الأدوار والنقاش والتصويت</small></span><span class="ar">‹</span></button>
    <button class="row" onclick="settings()"><span class="ico" style="--a:#2563EB;--b:#06B6D4">⚙️</span><span><b>الإعدادات</b><small>الوضع الليلي والنسخ الاحتياطي</small></span><span class="ar">‹</span></button>`;
}

/* ===== تقسيمات ===== */
function teamsMenu(){ theme("teams");
  $("app").innerHTML = `
    <button class="back" onclick="showMenu()">→ رجوع</button>
    ${bn("⚽","تقسيمات")}
    <button class="row" onclick="newGame()"><span class="ico" style="--a:#16A34A;--b:#0EA5A5">➕</span><span><b>تقسيمة يديدة</b><small>${players.length} لاعب محفوظ</small></span></button>
    <button class="row" onclick="showSaved()"><span class="ico" style="--a:#F59E0B;--b:#F97316">📂</span><span><b>تقسيماتك</b><small>${savedTeams.length} محفوظة</small></span></button>`;
}

function newGame(){ theme("teams"); editing = -1;
  $("app").innerHTML = `
    <button class="back" onclick="teamsMenu()">→ رجوع</button>
    ${bn("⚽","تقسيمة يديدة","أضف اللاعبين وقسّمهم")}
    <input id="name" placeholder="اسم اللاعب" onkeydown="onEnter(event,add)">
    <select id="rating">
      <option value="1">⭐</option><option value="2">⭐⭐</option>
      <option value="3" selected>⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option>
      <option value="5">⭐⭐⭐⭐⭐</option>
    </select>
    <button onclick="add()">➕ إضافة</button>
    <div id="list"></div>
    <button onclick="balancedSplit()">🎯 ذكي</button>
    <button onclick="randomSplit()">🎲 عشوائي</button>
    <button class="gray" onclick="clearPlayers()">🗑️ مسح كل اللاعبين</button>`;
  renderPlayers();
}

function add(){
  const name = $("name").value.trim();
  const rating = parseInt($("rating").value);
  if (!name) return;
  if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast("الاسم موجود من قبل");
  players.push({name, rating});
  $("name").value = ""; $("name").focus();
  saveAll(); renderPlayers();
}

function remove(i){ editing = -1; players.splice(i, 1); saveAll(); renderPlayers(); }

let editing = -1;
function editPlayer(i){ editing = editing === i ? -1 : i; renderPlayers(); }
function setStar(i, k){ players[i].rating = k; editing = -1; saveAll(); renderPlayers(); }
const starPicker = i => `<span class="pick">${[1, 2, 3, 4, 5].map(k => `<button class="st" onclick="setStar(${i},${k})">☆</button>`).join("")}</span>`;

function clearPlayers(){
  if (players.length) ask("تمسح كل اللاعبين؟", () => { players = []; saveAll(); renderPlayers(); toast("تم المسح"); });
}

function renderPlayers(){
  const list = $("list"); if (!list) return;
  list.innerHTML = `<p class="muted">${players.length} لاعب</p>` + players.map((p, i) => `
    <div class="player">
      <span class="who">${av(p.name)}<span>${esc(p.name)}<br>${editing === i ? starPicker(i) : `<small>${stars(p.rating)}</small>`}</span></span>
      <div>
        <button class="small-btn" onclick="editPlayer(${i})">✏️</button>
        <button class="small-btn delete" onclick="remove(${i})">❌</button>
      </div>
    </div>`).join("");
}

let lastTeams = null, lastMode = "balanced";

function finish(a, b, mode){
  if (Math.random() < 0.5) [a, b] = [b, a];   // عشان ما يكون نفس الفريق دايماً الأكبر
  lastTeams = {a, b, sa: sum(a), sb: sum(b)}; lastMode = mode; showResult();
}

function enough(){
  if (players.length < 2){ toast("أضف لاعبين على الأقل"); return false; }
  return true;
}

// تقسيم ذكي: عدد متساوي + أقل فرق ممكن في مجموع النجوم
function balancedSplit(){
  if (!enough()) return;
  const h = Math.ceil(players.length / 2), minDiff = sum(players) % 2;
  let best = null;
  for (let t = 0; t < 300; t++){
    const s = shuffle(players);
    const a = s.slice(0, h), b = s.slice(h);
    let improved = true;
    while (improved){
      improved = false;
      const d = sum(a) - sum(b);
      for (let i = 0; i < a.length && !improved; i++)
        for (let j = 0; j < b.length && !improved; j++){
          const x = a[i].rating - b[j].rating;
          if (Math.abs(d - 2 * x) < Math.abs(d)){ [a[i], b[j]] = [b[j], a[i]]; improved = true; }
        }
    }
    const diff = Math.abs(sum(a) - sum(b));
    if (!best || diff < best.diff) best = {a, b, diff};
    if (diff <= minDiff) break;
  }
  finish(best.a, best.b, "balanced");
}

function randomSplit(){
  if (!enough()) return;
  const s = shuffle(players), h = Math.ceil(s.length / 2);
  finish(s.slice(0, h), s.slice(h), "random");
}

function teamText(t){
  const list = x => x.map(p => "- " + p.name).join("\n");
  return (t.name ? t.name + "\n\n" : "") + `🏟️ ملعب (${t.sa}):\n${list(t.a)}\n\n⚽ كره (${t.sb}):\n${list(t.b)}`;
}

function teamHtml(t){
  const list = x => x.map(p => `<div class="pl">${av(p.name)}<span>${esc(p.name)}</span><span>${stars(p.rating)}</span></div>`).join("");
  return `<div class="team t1"><h3>🏟️ ملعب <em>${t.sa}</em></h3>${list(t.a)}</div>
          <div class="team t2"><h3>⚽ كره <em>${t.sb}</em></h3>${list(t.b)}</div>`;
}

function showResult(){ theme("teams");
  $("app").innerHTML = `
    <button class="back" onclick="newGame()">→ رجوع</button>
    ${teamHtml(lastTeams)}
    <input id="teamName" placeholder="اسم التقسيمة (اختياري)">
    <button onclick="saveTeams()">💾 حفظ</button>
    <button onclick="copyText(teamText(lastTeams))">📋 نسخ (واتساب)</button>
    <button onclick="reroll()">🔄 إعادة</button>`;
}

function reroll(){ lastMode === "balanced" ? balancedSplit() : randomSplit(); }

function saveTeams(){
  const name = $("teamName").value.trim() || new Date().toLocaleDateString("ar");
  savedTeams.push({name, ...lastTeams});
  saveAll(); toast("تم الحفظ ✅");
}

function showSaved(){ theme("teams");
  $("app").innerHTML = `
    <button class="back" onclick="teamsMenu()">→ رجوع</button>
    ${bn("📂","تقسيماتك")}
    ${savedTeams.length ? "" : '<p class="muted">ما عندك تقسيمات محفوظة، سوّ تقسيمة واحفظها.</p>'}
    ${savedTeams.map((t, i) => `
      <div class="box">
        <b>${esc(t.name)}</b><br>
        🏟️ (${t.sa}): ${t.a.map(x => esc(x.name)).join("، ")}<br>
        ⚽ (${t.sb}): ${t.b.map(x => esc(x.name)).join("، ")}<br>
        <button class="small-btn" onclick="copyText(teamText(savedTeams[${i}]))">📋 نسخ</button>
        <button class="small-btn delete" onclick="delTeam(${i})">❌ حذف</button>
      </div>`).reverse().join("")}`;
}

function delTeam(i){
  ask("تحذف هالتقسيمة؟", () => { savedTeams.splice(i, 1); saveAll(); showSaved(); });
}

/* ===== مافيا ===== */
const ROLES=[["مافيا","mafia"],["دكتور","doctor"],["شايب","sheeb"],["قناص","sniper"],["حارس","guard"],["آدمي","adami"]];
const ROLE_CLS=Object.fromEntries(ROLES);
const DESC={"شايب":"كل ليلة تسأل الراوي عن لاعب: مافيا ولا لا؟","قناص":"مرة وحدة في اللعبة تقدر تستبعد لاعب بالليل.","حارس":"كل ليلة تحمي لاعب من الاستبعاد."};
let cfg={"مافيا":0,"دكتور":1,"شايب":1,"قناص":0,"حارس":0};
try{ Object.assign(cfg, JSON.parse(localStorage.getItem("mafiaCfg")||"{}")); }catch(e){}
let deal=[], seen=[], dead=[], votes={};
const autoMafia = n => Math.max(1, Math.floor(n/4));

function mafiaMenu(){ theme("mafia");
  clearInterval(tInt); tInt=null;
  $("app").innerHTML = `
    <button class="back" onclick="showMenu()">→ رجوع</button>
    ${bn("🕵️","مافيا","أضف اللاعبين ووزّع الأدوار")}
    <button class="gray" onclick="help()">📖 كيف تلعب؟ ومهام الأدوار</button>
    <input id="mname" placeholder="اسم اللاعب" onkeydown="onEnter(event,addMafia)">
    <button onclick="addMafia()">➕ إضافة</button>
    <div id="mlist"></div>
    <button class="gray" onclick="rolesConfig()">⚙️ الأدوار</button>
    <button onclick="startMafia()">🎭 توزيع</button>
    <button class="gray" onclick="clearMafia()">🗑️ مسح كل اللاعبين</button>`;
  renderMafia();
}

function addMafia(){
  const name = $("mname").value.trim();
  if (!name) return;
  if (mafiaPlayers.some(p => p.toLowerCase() === name.toLowerCase())) return toast("الاسم موجود من قبل");
  mafiaPlayers.push(name);
  $("mname").value = ""; $("mname").focus();
  saveAll(); renderMafia();
}
function removeMafia(i){ mafiaPlayers.splice(i, 1); saveAll(); renderMafia(); }
function clearMafia(){
  if (mafiaPlayers.length) ask("تمسح كل اللاعبين؟", () => { mafiaPlayers = []; saveAll(); renderMafia(); toast("تم المسح"); });
}
function renderMafia(){
  const list = $("mlist"); if (!list) return;
  list.innerHTML = `<p class="muted">${mafiaPlayers.length} لاعب</p>` + mafiaPlayers.map((p, i) => `
    <div class="player"><span class="who">${av(p)}<span>${esc(p)}</span></span>
    <button class="small-btn delete" onclick="removeMafia(${i})">❌</button></div>`).join("");
}

/* ===== التعليم ===== */
const HELP_ROLES = [
  ["مافيا", "يعرفون بعض. كل ليلة يتفقون على لاعب يستبعدونه، وبالنهار يمثلون إنهم أبرياء."],
  ["دكتور", "كل ليلة يختار لاعب يحميه. إذا اختارته المافيا نفسه، ينجو."],
  ["شايب", DESC["شايب"]],
  ["قناص", DESC["قناص"]],
  ["حارس", DESC["حارس"]],
  ["آدمي", "ما عنده قدرة خاصة. سلاحه النقاش والتصويت عشان يكشف المافيا."]
];
const RULES = [
  ["🎯", "الهدف", "المدينة تكشف المافيا وتطلعهم كلهم. والمافيا تقلل المدينة لين يتساوون معهم أو يزيدون عليهم."],
  ["🧩", "التحضير", "أضف اللاعبين (4 على الأقل)، وحدد الأدوار من زر ⚙️ الأدوار، ثم اضغط توزيع. يفضل واحد يكون الراوي ويدير اللعبة."],
  ["🤫", "كشف الأدوار", "كل لاعب يضغط اسمه، يشوف دوره، يضغط إخفاء ويمرر الجوال للي بعده. المافيا يشوفون زملاءهم."],
  ["🌙", "الليل", "الكل يغمض عيونه. الراوي ينادي الأدوار وحدة وحدة: المافيا يختارون ضحية، الدكتور يحمي، والباقي يستخدمون قدراتهم."],
  ["☀️", "النهار", "الراوي يعلن مين طلع. الكل يناقش ويدافع عن نفسه، وبعدها تصويت: الأكثر أصوات يطلع ويكشف دوره."],
  ["🏆", "الفوز", "المدينة تفوز إذا طلعت كل المافيا. المافيا تفوز لما يتساوون مع الباقين أو يزيدون. شاشة التصويت تعلن النتيجة بنفسها."],
  ["⏱️", "نصيحة", "استخدم مؤقت النقاش في شاشة نقاش وتصويت عشان ما يطول الكلام."]
];
let helpTab = 0;
function help(tab = 0){
  helpTab = tab;
  document.querySelector(".modal")?.remove();
  const d = document.createElement("div");
  d.className = "modal";
  d.onclick = e => { if (e.target === d) d.remove(); };
  const body = tab === 0
    ? RULES.map(([i, t, x]) => `<div class="hcard"><b>${i} ${t}</b><p>${x}</p></div>`).join("")
    : `<p class="muted">اضغط على الدور عشان تشوف مهمته.</p>` + HELP_ROLES.map(([r, x]) =>
        `<details class="role-box ${ROLE_CLS[r]}"><summary>${ICON[r]} ${r}</summary><p>${x}</p></details>`).join("");
  d.innerHTML = `<div class="sheet">
    <div class="tabs">
      <button class="${tab === 0 ? "" : "gray"}" onclick="help(0)">📖 كيف تلعب</button>
      <button class="${tab === 1 ? "" : "gray"}" onclick="help(1)">🎭 مهام الأدوار</button>
    </div>
    <div class="sbody">${body}</div>
    <button class="gray" onclick="document.querySelector('.modal').remove()">إغلاق</button>
  </div>`;
  document.body.appendChild(d);
}

/* الأدوار: تحكم بالعدد */
function rolesConfig(){ theme("mafia");
  const n = mafiaPlayers.length;
  $("app").innerHTML = `
    <button class="back" onclick="mafiaMenu()">→ رجوع</button>
    ${bn("🎭","الأدوار")}
    <p class="muted">${n} لاعب، والباقي آدميين.</p>` +
    ROLES.slice(0, -1).map(([r, c]) => `
    <div class="player">
      <span class="tag ${c}">${r}${r === "مافيا" && !cfg[r] ? ` (تلقائي: ${autoMafia(n)})` : ""}</span>
      <div><button class="small-btn" onclick="chg('${r}',-1)">−</button><b>${cfg[r]}</b>
      <button class="small-btn" onclick="chg('${r}',1)">+</button></div>
    </div>`).join("");
}
function chg(r, d){
  cfg[r] = Math.max(0, Math.min(10, cfg[r] + d));
  localStorage.setItem("mafiaCfg", JSON.stringify(cfg));
  rolesConfig();
}

function startMafia(){
  const n = mafiaPlayers.length;
  if (n < 4) return toast("لازم 4 لاعبين على الأقل");
  const m = cfg["مافيا"] || autoMafia(n);
  const list = Array(m).fill("مافيا");
  ROLES.slice(1, -1).forEach(([r]) => list.push(...Array(cfg[r]).fill(r)));
  if (m * 2 >= n) return toast("عدد المافيا كثير على عدد اللاعبين");
  if (list.length > n) return toast("عدد الأدوار أكثر من اللاعبين");
  while (list.length < n) list.push("آدمي");
  const roles = shuffle(list);
  deal = mafiaPlayers.map((name, i) => ({name, role: roles[i]}));
  seen = []; dead = []; votes = {};
  revealList();
}

/* كشف الدور بشكل سري */
function revealList(){ theme("mafia");
  clearInterval(tInt); tInt = null;
  $("app").innerHTML = `
    <button class="back" onclick="mafiaMenu()">→ رجوع</button>
    ${bn("🎭","كل لاعب يشوف دوره")}
    <p class="muted">اضغط اسمك، شوف دورك، ثم اضغط إخفاء ومرر الجوال.</p>
    ${deal.map((p, i) => `<button class="${seen.includes(i) ? "gray" : ""}" onclick="showRole(${i})">${seen.includes(i) ? "✅ " : ""}${esc(p.name)}</button>`).join("")}
    <button onclick="voteScreen()">🗳️ نقاش وتصويت</button>
    <button class="gray" onclick="help(1)">📖 مهام الأدوار</button>
    <button class="gray" onclick="showAllRoles()">👁️ عرض كل الأدوار (للراوي)</button>
    <button class="gray" onclick="startMafia()">🔄 إعادة توزيع</button>`;
}

function showRole(i){ theme("mafia");
  const p = deal[i];
  const mates = deal.filter((x, j) => j !== i && x.role === "مافيا").map(x => esc(x.name));
  $("app").innerHTML = `
    <div class="role-box pop ${ROLE_CLS[p.role]}" style="font-size:26px;padding:34px 15px;margin-top:30px"><div class="big">${ICON[p.role]}</div>${esc(p.name)}<br>${p.role}</div>
    ${DESC[p.role] ? `<p>${DESC[p.role]}</p>` : ""}
    ${p.role === "مافيا" ? `<p>${mates.length ? "زملاءك: " + mates.join("، ") : "أنت المافيا الوحيد"}</p>` : ""}
    <button onclick="hideRole(${i})">إخفاء ✅</button>`;
}
function hideRole(i){ if (!seen.includes(i)) seen.push(i); revealList(); }

function showAllRoles(){ theme("mafia");
  const idx = r => ROLES.findIndex(x => x[0] === r);
  $("app").innerHTML = `<button class="back" onclick="revealList()">→ رجوع</button>${bn("👁️","كل الأدوار")}` +
    deal.map((x, i) => ({...x, i})).sort((a, b) => idx(a.role) - idx(b.role)).map(x =>
      `<div class="role-box ${ROLE_CLS[x.role]}"${dead.includes(x.i) ? ' style="opacity:.4;text-decoration:line-through"' : ""}>${ICON[x.role]} ${esc(x.name)} → ${x.role}</div>`).join("");
}

/* مؤقت النقاش */
let tSet = 120, tLeft = 120, tInt = null, actx = null;
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function setT(s){
  clearInterval(tInt); tInt = null; tSet = tLeft = s;
  if ($("clock")) $("clock").textContent = fmt(s);
  if ($("bar")) $("bar").style.width = "100%";
}
function timer(){
  if (tInt){ clearInterval(tInt); tInt = null; return; }
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); }catch(e){}
  if (tLeft <= 0) tLeft = tSet;
  tInt = setInterval(() => {
    tLeft--;
    if ($("clock")) $("clock").textContent = fmt(tLeft);
    if ($("bar")) $("bar").style.width = (tLeft / tSet * 100) + "%";
    if (tLeft <= 0){ clearInterval(tInt); tInt = null; beep(); toast("انتهى الوقت ⏰"); }
  }, 1000);
}
function beep(){
  try{ const o = actx.createOscillator(); o.connect(actx.destination); o.frequency.value = 880; o.start(); setTimeout(() => o.stop(), 700); }catch(e){}
  if (navigator.vibrate) navigator.vibrate(500);
}

/* التصويت */
function voteScreen(msg = ""){ theme("mafia");
  const all = deal.map((p, i) => ({...p, i}));
  const alive = all.filter(p => !dead.includes(p.i));
  const mf = alive.filter(p => p.role === "مافيا").length;
  const st = mf === 0 ? "🎉 فازت المدينة" : mf >= alive.length - mf ? "😈 فازت المافيا" : `باقي ${alive.length} لاعب`;
  $("app").innerHTML = `
    <button class="back" onclick="revealList()">→ رجوع</button>
    ${bn("🗳️","نقاش وتصويت")}
    <div class="box"><b>${st}</b></div>
    <div class="box" style="text-align:center">
      <div id="clock">${fmt(tLeft)}</div><div class="bar"><i id="bar" style="width:${tSet ? tLeft / tSet * 100 : 0}%"></i></div>
      <button class="small-btn" onclick="timer()">▶️ / ⏸</button>
      ${[60, 120, 180, 300].map(s => `<button class="small-btn gray" onclick="setT(${s})">${s / 60}د</button>`).join("")}
    </div>
    ${msg ? `<div class="box">${msg}</div>` : ""}
    ${alive.map(p => `
      <div class="player"><span class="who">${av(p.name)}<span>${esc(p.name)}</span></span>
      <div><button class="small-btn gray" onclick="vote(${p.i},-1)">−</button><b>${votes[p.i] || 0}</b>
      <button class="small-btn" onclick="vote(${p.i},1)">+</button>
      <button class="small-btn delete" onclick="ask('استبعاد ' + deal[${p.i}].name + '؟', () => kill(${p.i}))">💀</button></div></div>`).join("")}
    <button onclick="result()">🏁 إعلان النتيجة</button>
    ${dead.length ? `<p class="muted">خرجوا: ${dead.map(i => esc(deal[i].name) + " (" + deal[i].role + ")").join("، ")}</p>` : ""}`;
}
function vote(i, d){ votes[i] = Math.max(0, (votes[i] || 0) + d); voteScreen(); }
function result(){
  const alive = deal.map((p, i) => ({...p, i})).filter(p => !dead.includes(p.i));
  const max = Math.max(0, ...alive.map(p => votes[p.i] || 0));
  if (!max) return toast("ما فيه أصوات");
  const top = alive.filter(p => (votes[p.i] || 0) === max);
  if (top.length > 1) return voteScreen(`تعادل بين: ${top.map(p => esc(p.name)).join("، ")}<br><button onclick="votes={};voteScreen()">تصويت جديد</button>`);
  voteScreen(`الأكثر أصوات: <b>${esc(top[0].name)}</b> (${max})<br><button class="delete" onclick="kill(${top[0].i})">💀 إخراجه</button>`);
}
function kill(i){
  if (!dead.includes(i)) dead.push(i);
  votes = {};
  voteScreen(`خرج <b>${esc(deal[i].name)}</b> وكان <b>${deal[i].role}</b>`);
}

/* ===== إعدادات ===== */
function settings(){ theme("home");
  $("app").innerHTML = `
    <button class="back" onclick="showMenu()">→ رجوع</button>
    ${bn("⚙️","الإعدادات")}
    <button onclick="toggleDark()">🌙 / ☀️ الوضع الليلي</button>
    <button onclick="exportData()">📤 نسخة احتياطية (نسخ)</button>
    <button onclick="importData()">📥 استرجاع نسخة</button>
    <p class="muted">البيانات تنحفظ في متصفحك فقط. خذ نسخة احتياطية قبل ما تمسح بيانات المتصفح أو تغير الجهاز.</p>
    <button class="corner" onclick="credit()">🐙</button>`;
}

function toggleDark(){
  darkMode = !darkMode;
  localStorage.setItem("dark", darkMode);
  document.body.classList.toggle("dark", darkMode);
}

function exportData(){ copyText(JSON.stringify({players, teams: savedTeams, mafiaPlayers})); }

function importData(){
  const txt = prompt("الصق النسخة الاحتياطية هنا:");
  if (!txt) return;
  try{
    const d = JSON.parse(txt);
    if (![d.players, d.teams, d.mafiaPlayers].every(Array.isArray)) throw 0;
    players = d.players; savedTeams = d.teams; mafiaPlayers = d.mafiaPlayers;
    saveAll(); toast("تم الاسترجاع ✅");
  }catch(e){ toast("النسخة غير صحيحة"); }
}

showMenu();
</script>
